name: Feature request
description: Suggest an improvement to the action (new input, output, provider support, etc.)
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: A new input/output, provider compatibility fix, or behavior change.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
